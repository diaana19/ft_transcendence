# Edge reverse proxy — the single public entrypoint.
# Terminates TLS, redirects HTTP→HTTPS, and routes:
#   /api/  -> backend (REST + WebSocket upgrade for /api/ws/*)
#   /      -> frontend (static SPA)

# WebSocket upgrade plumbing (set Connection: upgrade only for ws requests).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

# HTTPS entrypoint. Rootless Podman can't bind privileged host ports (<1024), so
# this is published on an unprivileged port (default 3000) -> container :443.
server {
    listen 443 ssl;
    http2 on;
    server_name ft_transcendence.42.fr;

    ssl_certificate     /etc/ssl/certs/ft_transcendence.42.fr.crt;
    ssl_certificate_key /etc/ssl/private/ft_transcendence.42.fr.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A plain-HTTP request to this TLS port -> redirect to HTTPS on the same
    # host:port the client used ($http_host keeps the port, so nothing is hardcoded).
    error_page 497 =301 https://$http_host$request_uri;

    # Allow file uploads through the proxy.
    client_max_body_size 25m;

    # REST API and WebSocket (/api/ws/chat) -> backend.
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Swagger / OpenAPI docs -> backend. Served by the backend at /swagger/ but
    # kept off the /api/ prefix so the docs have their own stable URL.
    location = /swagger { return 301 /swagger/index.html; }
    location /swagger/ {
        proxy_pass http://backend/swagger/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> static SPA served by the frontend container.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
