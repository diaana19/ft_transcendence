# Static SPA server (internal). Reached only through the edge proxy.
# Serves the built React app with single-page-app fallback to index.html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the PWA manifest with the correct MIME type instead of the
    # nginx default (application/octet-stream) — Lighthouse PWA criterion.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri /index.html;
    }
}
